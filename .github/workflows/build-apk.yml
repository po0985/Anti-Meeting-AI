name: Build Habit Tracker APK

on:
  push:
    branches:
      - 'claude/session-iuab95'
    paths:
      - 'android-app/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Accept Android SDK licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || \
          yes | $ANDROID_HOME/cmdline-tools/11.0/bin/sdkmanager --licenses 2>/dev/null || \
          echo "License step skipped"

      - name: Install required SDK components
        run: |
          SDKMGR="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -f "$SDKMGR" ] || SDKMGR="$ANDROID_HOME/cmdline-tools/11.0/bin/sdkmanager"
          "$SDKMGR" "platforms;android-34" "build-tools;34.0.0" "platform-tools" 2>/dev/null || true

      - name: Setup Gradle 8.4
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.4"

      - name: Build Debug APK
        working-directory: android-app
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Show APK info
        working-directory: android-app
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          echo "APK size: $(du -sh $APK | cut -f1)"
          echo "::notice::APK built successfully!"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: habit-tracker-debug-apk
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error
